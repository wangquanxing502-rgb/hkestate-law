<!DOCTYPE html>
<html>
  <body>
    <!-- This file exists only so Netlify registers the form at build time. It is never shown to users. -->
    <form name="consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <select name="estateType">
        <option value="物业">物业</option>
        <option value="银行存款">银行存款</option>
        <option value="其他">其他</option>
      </select>
      <input type="text" name="location" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
